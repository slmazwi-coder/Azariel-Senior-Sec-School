<svg width="1920" height="650" viewBox="0 0 1920 650" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky gradient background -->
  <defs>
    <linearGradient id="skyGradient3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D3F6E"/>
      <stop offset="45%" style="stop-color:#1F6FA5"/>
      <stop offset="100%" style="stop-color:#4EA8DE"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="650" fill="url(#skyGradient3)"/>
  
  <!-- School building silhouette -->
  <g transform="translate(760, 250)">
    <!-- Main building -->
    <rect x="0" y="80" width="400" height="200" fill="rgba(255,255,255,0.1)"/>
    <!-- Roof -->
    <polygon points="200,0 0,80 400,80" fill="rgba(255,255,255,0.15)"/>
    <!-- Windows -->
    <rect x="40" y="120" width="40" height="60" rx="4" fill="rgba(201,162,39,0.3)"/>
    <rect x="120" y="120" width="40" height="60" rx="4" fill="rgba(201,162,39,0.3)"/>
    <rect x="200" y="120" width="40" height="60" rx="4" fill="rgba(201,162,39,0.3)"/>
    <rect x="280" y="120" width="40" height="60" rx="4" fill="rgba(201,162,39,0.3)"/>
    <!-- Door -->
    <rect x="170" y="180" width="60" height="100" rx="30" fill="rgba(201,162,39,0.4)"/>
    <!-- Flagpole -->
    <rect x="350" y="0" width="4" height="80" fill="rgba(255,255,255,0.3)"/>
    <rect x="354" y="0" width="30" height="20" fill="#C9A227"/>
  </g>
  
  <!-- Text -->
  <text x="960" y="520" text-anchor="middle" font-family="Arial" font-size="28" fill="rgba(255,255,255,0.6)">Our Proud Learners</text>
</svg>