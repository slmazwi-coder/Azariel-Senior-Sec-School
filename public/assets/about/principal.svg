<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#0D3F6E"/>
  
  <!-- Person silhouette -->
  <g transform="translate(200, 120)">
    <!-- Head -->
    <circle cx="0" cy="0" r="50" fill="rgba(255,255,255,0.2)"/>
    <!-- Shoulders -->
    <ellipse cx="0" cy="120" rx="80" ry="60" fill="rgba(255,255,255,0.15)"/>
  </g>
  
  <!-- Suit indication -->
  <path d="M120 280 L200 200 L280 280" stroke="#4EA8DE" stroke-width="3" fill="none"/>
  
  <!-- Tie -->
  <polygon points="200,200 190,280 200,300 210,280" fill="#C9A227"/>
  
  <!-- Icon overlay -->
  <circle cx="200" cy="180" r="35" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <text x="200" y="188" text-anchor="middle" font-size="30" fill="rgba(255,255,255,0.5)">👤</text>
  
  <!-- Label -->
  <text x="200" y="370" text-anchor="middle" font-family="Arial" font-size="14" fill="rgba(255,255,255,0.5)">Principal Photo</text>
</svg>